<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BCMS95 — Acesso Restrito</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07080b;
  --bg2:#111318;
  --panel:#15181eec;
  --panel2:#1b2028ee;
  --line:#ff3d3d;
  --line2:#ffac69;
  --accent:#ff4b4b;
  --accent2:#ffa45a;
  --text:#f5f1ea;
  --muted:#d8c2ab;
  --input:#0f1318;
  --inputLine:#7d5230;
  --ok:#48df89;
  --danger:#ff8f96;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font:14px "Arial Nova",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 18% 18%,#ff2a2a18 0 6%,transparent 7% 18%),
    radial-gradient(circle at 76% 24%,#ff252514 0 4%,transparent 5% 12%),
    radial-gradient(circle at 50% 110%,#4d1a1310 0 20%,transparent 21% 45%),
    linear-gradient(180deg,#0c0d12 0%,#060709 100%);
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    repeating-linear-gradient(125deg,transparent 0 28px,#ff3c3c10 28px 29px,transparent 29px 78px),
    linear-gradient(90deg,#00000000 0%,#ff2d2d0c 35%,#00000000 70%);
  opacity:.6;
  pointer-events:none;
}
#mecha-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.ring,.beam,.spark,.gridline{position:absolute;pointer-events:none}
.ring{
  right:-60px; top:30px; width:420px; height:420px; border-radius:50%;
  border:2px solid #ff282832; box-shadow:0 0 25px #ff1c1c12,inset 0 0 30px #ff3d3d08;
}
.ring::before,.ring::after{content:"";position:absolute;border-radius:50%;inset:46px;border:2px solid #ff9c4b2c}
.ring::after{inset:120px;border-color:#ff34343c}
.beam{
  inset:auto auto 0 0; width:100%; height:100%;
  background:
    linear-gradient(130deg,transparent 48%,#ff2d2d18 50%,transparent 52%),
    linear-gradient(145deg,transparent 22%,#ff2b2b11 24%,transparent 26%);
  filter:blur(1px);
  animation:sweep 9s linear infinite alternate;
}
.spark{
  width:16px; height:16px; border-radius:50%; background:#ff4e4e55; box-shadow:0 0 18px #ff4d4d99,0 0 34px #ff292990;
  left:18%; top:22%; animation:pulse 2.6s ease-in-out infinite alternate;
}
.spark.s2{width:10px;height:10px;left:77%;top:19%;animation-duration:3.3s}
.spark.s3{width:9px;height:9px;left:67%;top:68%;animation-duration:4s}
.gridline{
  inset:0;
  background-image:linear-gradient(#ff454510 1px,transparent 1px),linear-gradient(90deg,#ff454510 1px,transparent 1px);
  background-size:52px 52px; opacity:.18; mask-image:linear-gradient(180deg,#000 20%,transparent 100%);
}
.wrapper{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:28px}
.card{
  position:relative;
  width:min(92vw,440px);
  padding:22px 24px 20px;
  border-radius:18px;
  background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
  border:1px solid #ff444450;
  box-shadow:0 24px 90px #0009, inset 0 0 0 1px #ffac6916, 0 0 45px #ff3a3a12;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 84% 21%,#ff2a2a20 0 7%,transparent 8% 20%),
    linear-gradient(90deg,#ff4c4c0d,#0000 44%),
    repeating-linear-gradient(135deg,transparent 0 34px,#ffffff05 34px 35px,transparent 35px 88px);
  pointer-events:none;
}
.card::after{
  content:"";position:absolute;inset:10px;
  border:1px solid #ff9b4a22;
  border-radius:12px;
  clip-path:polygon(0 0,100% 0,100% 86%,96% 100%,0 100%);
  pointer-events:none;
}
.topbar{
  position:relative; z-index:2;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:18px;
}
.signal{
  display:flex; align-items:center; gap:8px;
  padding:6px 10px;
  border:1px solid #ff4f4f6e;
  background:#110f13d8;
  color:#ffd9b4;
  font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
}
.signal .led{width:8px;height:8px;border-radius:50%;background:#ff3030;box-shadow:0 0 10px #ff3636,0 0 18px #ff2b2b}
.badge{
  padding:6px 10px; border-radius:999px; border:1px solid #ffa65d90; color:#ffd4b1;
  background:#2b2018d9; font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
}
.identity{position:relative;z-index:2;display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;margin-bottom:16px}
.logo{
  width:62px; height:62px; display:grid; place-items:center;
  border-radius:15px; border:1px solid #ff5252; background:#151217e0;
  box-shadow:inset 0 0 16px #ff4d4d18, 0 0 20px #ff2d2d12;
}
.logo svg{width:42px;height:42px}
.title h1{margin:0;color:#fff;font-size:30px;line-height:1;letter-spacing:.03em}
.title h1 em{font-style:normal;color:#ff4f4f;text-shadow:0 0 14px #ff4f4f44}
.title .sub{margin:7px 0 0;color:#f1a9a9;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.title .mini{margin:6px 0 0;color:#d8cdc2;font-size:12px}
.form-grid{position:relative;z-index:2}
label{display:block;margin:12px 0 7px;color:#f3e1d0;font-weight:700;letter-spacing:.02em}
.input-wrap{position:relative}
.input-wrap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:8px 0 0 8px;background:linear-gradient(180deg,var(--accent2),var(--accent));opacity:.9}
input{
  width:100%; padding:14px 14px 14px 18px; border-radius:10px; border:1px solid var(--inputLine);
  outline:none; background:linear-gradient(180deg,#0c1015,#0e1318); color:#fff; font:inherit;
  transition:.2s border-color,.2s box-shadow,.2s transform;
}
input::placeholder{color:#8f8a84}
input:focus{border-color:#ff5d5d;box-shadow:0 0 0 3px #ff424220,0 0 18px #ff424218;transform:translateY(-1px)}
button{
  border:0; outline:none; cursor:pointer; font:inherit;
}
#go{
  position:relative; z-index:2; width:100%; margin-top:18px; padding:14px 16px; border-radius:11px;
  border:1px solid #ffa962; color:#1f1208; font-weight:900; letter-spacing:.03em;
  background:linear-gradient(90deg,#ffae6b,#ff4f4f 52%,#ff4747);
  box-shadow:0 8px 24px #ff3a3a24, inset 0 1px 0 #fff5;
}
#go:hover{filter:brightness(1.03);transform:translateY(-1px)}
#go:disabled{opacity:.65;cursor:wait;transform:none}
.error{position:relative;z-index:2;color:var(--danger);font-size:12px;min-height:18px;margin:12px 0 0;text-align:center;font-weight:700}
.foot{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  color:#d5c5b3;text-align:center;font-size:11px;margin:18px 0 0;padding-top:14px;border-top:1px solid #ff43431f
}
.foot .ok{display:inline-flex;align-items:center;gap:6px;color:#ffe6bf}
.foot .ok::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.corner{
  position:absolute; width:18px; height:18px; border-color:#fff3; z-index:2;
}
.c1{top:12px;left:12px;border-top:2px solid #fff7;border-left:2px solid #fff7;border-top-left-radius:8px}
.c2{top:12px;right:12px;border-top:2px solid #fff7;border-right:2px solid #fff7;border-top-right-radius:8px}
.c3{bottom:12px;left:12px;border-bottom:2px solid #ff4e4e55;border-left:2px solid #ff4e4e55;border-bottom-left-radius:8px}
.c4{bottom:12px;right:12px;border-bottom:2px solid #ff4e4e55;border-right:2px solid #ff4e4e55;border-bottom-right-radius:8px}
@keyframes pulse{from{transform:scale(.95);opacity:.5}to{transform:scale(1.1);opacity:1}}
@keyframes sweep{from{transform:translateX(-1.5%) translateY(-1%)}to{transform:translateX(1.5%) translateY(1%)}}
@media (max-width:560px){
  .wrapper{padding:16px}
  .card{width:min(96vw,420px);padding:18px 18px 16px}
  .identity{grid-template-columns:54px 1fr;gap:12px}
  .logo{width:54px;height:54px}
  .title h1{font-size:26px}
  .title .sub{font-size:10px;letter-spacing:.13em}
  .foot{justify-content:center}
  .ring{right:-150px;top:120px;width:320px;height:320px}
}
@media (prefers-reduced-motion:reduce){.beam,.spark{animation:none}}

/* Cenário mecha interativo — grafite/âmbar, sem interferir na autenticação */
#mecha-bg{z-index:0}
#mecha-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;opacity:.97}
#mecha-bg .ring,#mecha-bg .beam,#mecha-bg .spark{display:none}
#mecha-bg .gridline{opacity:.24}
#mecha-bg .mecha-side{position:absolute;left:clamp(12px,4vw,60px);top:50%;transform:translateY(-50%);
  width:min(19vw,225px);height:52vh;min-height:300px;border-left:1px solid #ff3d3d38;
  background:repeating-linear-gradient(180deg,transparent 0 22px,#ff46461c 23px 24px,transparent 25px 44px);
  mask-image:linear-gradient(180deg,transparent,#000 17% 83%,transparent);opacity:.55}
#mecha-bg .mecha-side::after{content:"";position:absolute;top:8%;left:15px;height:65%;border-left:2px solid #ffa45a55}
#mecha-bg .mecha-edge{position:absolute;right:2vw;bottom:6vh;width:clamp(80px,14vw,175px);height:120px;
  border-bottom:2px solid #ff4646a0;border-right:2px solid #ff464677;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);
  opacity:.55}
.card{transition:box-shadow .25s ease,border-color .25s ease;transform-style:preserve-3d}
.card:hover{border-color:#ff5b5b91;box-shadow:0 26px 90px #000b,inset 0 0 0 1px #ffac6918,0 0 45px #ff3a3a25}
.card .topbar,.card .identity,.card .form-grid{transform:translateZ(8px)}
.card .logo{animation:mechaLogoEnergy 4s ease-in-out infinite alternate}
@keyframes mechaLogoEnergy{from{box-shadow:inset 0 0 10px #ff4d4d12,0 0 5px #ff2d2d10}
to{box-shadow:inset 0 0 22px #ff4d4d2c,0 0 22px #ff4e4e35}}
@media(max-width:720px){#mecha-bg .mecha-side{display:none}#mecha-bg .mecha-edge{opacity:.24}}
@media(prefers-reduced-motion:reduce){.card .logo{animation:none}.card{transition:none}}

</style>
</head>
<body>
<div id="mecha-bg" aria-hidden="true">
  <canvas id="mecha-canvas"></canvas>
  <div class="mecha-side"></div><div class="mecha-edge"></div>
  <div class="gridline"></div>
  <div class="beam"></div>
  <div class="ring"></div>
  <div class="spark"></div>
  <div class="spark s2"></div>
  <div class="spark s3"></div>
</div>
<div class="wrapper">
  <form id="form" class="card" autocomplete="on">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <div class="topbar">
      <div class="signal"><span class="led"></span>acesso restrito</div>
      <div class="badge">autenticação online</div>
    </div>

    <div class="identity">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 60 60" role="img" aria-label="BCMS95: gráfico e estrela">
          <defs><linearGradient id="bcmsLoginGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffad6a"/><stop offset="1" stop-color="#ff3d3d"/></linearGradient></defs>
          <path d="M10 48H51" stroke="#ffbc86" stroke-width="2.3" stroke-linecap="round"/>
          <rect x="13" y="32" width="8" height="15" rx="1.1" fill="#ffffff"/>
          <rect x="26" y="24" width="8" height="23" rx="1.1" fill="#ffffff"/>
          <rect x="39" y="17" width="8" height="30" rx="1.1" fill="#ffffff"/>
          <path d="M10 34L24 25L35 26L47 12" stroke="url(#bcmsLoginGlow)" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M47 6L49 11L54 12L50 16L51 21L47 18L43 21L44 16L40 12L45 11Z" fill="#2d2110" stroke="#ffad6a" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="title">
        <h1>BCMS95 <em>LOGIN</em></h1>
        <div class="sub">Gestão de Capacitores & Relatórios</div>
        <div class="mini">Controle de componentes, conversão de unidades e emissão de laudos de Tapeboard</div>
      </div>
    </div>

    <div class="form-grid">
      

      <label for="pass">Senha</label>
      <div class="input-wrap"><input id="pass" name="password" type="password" autocomplete="current-password" required placeholder="Informe sua senha"></div>

      <button id="go" type="submit">Entrar no sistema</button>
      <p id="error" class="error" role="alert"></p>

      <div class="foot">
        <span class="ok">Ambiente privado</span>
        <span>Validação segura de acesso</span>
      </div>
    </div>
  </form>
</div>
<script>

/* Animação gráfica independente da lógica de autenticação. */
(()=>{
 const canvas=document.getElementById('mecha-canvas');
 const ctx=canvas&&canvas.getContext('2d',{alpha:true});
 if(!ctx)return;
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
 let w=0,h=0,dpr=1,raf=0,last=0,clock=0;
 const pointer={x:.68,y:.46,tx:.68,ty:.46,active:false};
 const TAU=Math.PI*2;
 const rand=(n)=>((Math.sin(n*127.1+33.7)*43758.5453)%1+1)%1;
 const particles=Array.from({length:55},(_,i)=>({
   x:rand(i+2),y:rand(i+200),r:1.1+rand(i+600)*2,
   speed:.008+rand(i+700)*.018,phase:rand(i+80)*TAU,
   hue:i%7===0?27:0
 }));
 function resize(){
   w=window.innerWidth; h=window.innerHeight;
   dpr=Math.min(window.devicePixelRatio||1,2);
   canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
   ctx.setTransform(dpr,0,0,dpr,0,0);
 }
 function line(x1,y1,x2,y2,stroke,width=1){
   ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();
 }
 function drawHex(x,y,r,rotation,color,width=1){
   ctx.beginPath();
   for(let k=0;k<6;k++){
    const a=rotation+TAU*k/6;
    const xx=x+Math.cos(a)*r,yy=y+Math.sin(a)*r;
    if(!k)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
   }
   ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
 }
 function arc(x,y,r,start,end,color,width=1){
   ctx.beginPath();ctx.arc(x,y,r,start,end);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
 }
 function draw(t){
   ctx.clearRect(0,0,w,h);
   pointer.x+=(pointer.tx-pointer.x)*.055;
   pointer.y+=(pointer.ty-pointer.y)*.055;
   const px=pointer.x*w,py=pointer.y*h;
   const coreX=w*(w>900?.76:.74);
   const coreY=h*(w>900?.46:.33);
   const R=Math.min(w,h)*.29;
   ctx.save();ctx.globalCompositeOperation='screen';
   // luz suave de fundo, sem prejudicar o formulário
   const halo=ctx.createRadialGradient(coreX,coreY,8,coreX,coreY,R*1.65);
   halo.addColorStop(0,'rgba(255,61,61,.14)');
   halo.addColorStop(.45,'rgba(255,39,39,.035)');
   halo.addColorStop(1,'rgba(255,39,39,0)');
   ctx.fillStyle=halo;ctx.fillRect(coreX-R*2,coreY-R*2,R*4,R*4);
   // anéis mecanizados, segmentos contrarrotativos
   for(let k=0;k<4;k++){
     const radius=R*(.54+k*.22);
     arc(coreX,coreY,radius,0,TAU,`rgba(255,${55+k*12},69,${.06+k*.025})`,1);
     const count=6+k*3;
     for(let j=0;j<count;j++){
       const a=t*(k%2?-1:1)*(.095+k*.04)+j*TAU/count+k;
       const span=(TAU/count)*(.32+(j%3)*.12);
       arc(coreX,coreY,radius,a,a+span,
         j%3===0?'rgba(255,172,105,.8)':'rgba(255,48,48,.51)',j%3===0?2.6:1.7);
     }
   }
   // segmentos externos tipo blindagem
   for(let j=0;j<12;j++){
     const a=t*.074+j*TAU/12;
     const inR=R*1.28,outR=R*(1.36+(j%3)*.027);
     line(coreX+Math.cos(a)*inR,coreY+Math.sin(a)*inR,
       coreX+Math.cos(a)*outR,coreY+Math.sin(a)*outR,'rgba(255,153,69,.45)',1.5);
   }
   drawHex(coreX,coreY,R*.36,-t*.1,'rgba(255,154,72,.3)',1.2);
   drawHex(coreX,coreY,R*.25,t*.145,'rgba(255,60,60,.64)',1.6);
   drawHex(coreX,coreY,R*.16,Math.PI/6,'rgba(255,166,93,.9)',2.2);
   // única interação com o mouse: luz galáctica pulsante
   const cx=px;
   const cy=py;
   const pulse=30+Math.sin(t*4.1)*6;
   const g=ctx.createRadialGradient(cx,cy,0,cx,cy,pulse*1.9);
   g.addColorStop(0,'rgba(255,246,186,.98)');
   g.addColorStop(.12,'rgba(255,172,104,.82)');
   g.addColorStop(.32,'rgba(255,71,71,.42)');
   g.addColorStop(.62,'rgba(255,42,42,.16)');
   g.addColorStop(1,'rgba(255,0,0,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,pulse*1.9,0,TAU);ctx.fill();
   ctx.beginPath();ctx.arc(cx,cy,pulse*.18,0,TAU);ctx.fillStyle='rgba(255,240,190,.95)';ctx.fill();
   // feixes diagonais vivos com movimento contínuo
   for(let j=0;j<5;j++){
     const shift=(t*14+j*130)%(w+320)-160;
     const fade=ctx.createLinearGradient(shift-145,0,shift+130,h);
     fade.addColorStop(0,'rgba(255,47,47,0)');
     fade.addColorStop(.55,j%2?'rgba(255,164,90,.055)':'rgba(255,45,45,.07)');
     fade.addColorStop(1,'rgba(255,47,47,0)');
     line(shift-180,0,shift+145,h,fade,j%2?1.7:2.4);
   }
   // partículas independentes, profundidade e leve atração pelo ponteiro
   for(let i=0;i<particles.length;i++){
     const p=particles[i];
     const x=p.x*w+Math.sin(t*.27+p.phase)*12;
     const y=((p.y-t*p.speed*.12+3)%1)*h+Math.cos(t*.33+p.phase)*8;
     const alpha=.24+.35*(.5+.5*Math.sin(t*1.2+p.phase));
     ctx.fillStyle=`hsla(${p.hue},100%,68%,${alpha})`;
     ctx.beginPath();ctx.arc(x,y,p.r,0,TAU);ctx.fill();
     if(i%11===0){arc(x,y,p.r*3,0,TAU,`rgba(255,156,75,${alpha*.12})`,1)}
   }
   ctx.restore();
 }
 function frame(ms){
   if(document.hidden){raf=0;return}
   const dt=Math.min((ms-last)/1000||0,.05);last=ms;clock+=dt;
   draw(clock);raf=requestAnimationFrame(frame);
 }
 function restart(){if(!raf&&!reduced.matches){last=performance.now();raf=requestAnimationFrame(frame)}}
 function stop(){if(raf){cancelAnimationFrame(raf);raf=0}draw(0)}
 window.addEventListener('resize',resize,{passive:true});
 window.addEventListener('pointermove',(e)=>{
   if(e.pointerType==='touch')return;
   pointer.tx=e.clientX/Math.max(w,1);pointer.ty=e.clientY/Math.max(h,1);
   pointer.active=true;
 },{passive:true});
 window.addEventListener('pointerleave',()=>{pointer.active=false;pointer.tx=.68;pointer.ty=.46});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0}else restart()});
 if(reduced.addEventListener)reduced.addEventListener('change',()=>reduced.matches?stop():restart());
 resize();draw(0);restart();
})();

document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('go'),err=document.getElementById('error');
  b.disabled=true; err.textContent='';
  try{
    const res=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'same-origin',
      body:JSON.stringify({
        password:document.getElementById('pass').value
      })
    });
    const v=await res.json();
    if(!res.ok) throw Error(v.erro||'Não foi possível entrar.');
    document.getElementById('pass').value='';
    location.replace('/');
  }catch(ex){
    err.textContent=ex.message;
  }finally{
    b.disabled=false;
  }
});
fetch('/api/auth/session',{credentials:'same-origin',cache:'no-store'})
 .then(res=>res.ok?res.json():null)
 .then(data=>{if(data?.authenticated)location.replace('/')})
 .catch(()=>{});
</script>
</body>
</html>
